name: tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        laravel: [11, 12, 13]
        driver: [swoole, openswoole, 'roadrunner/frankenphp']
        exclude:
          - php: 8.2
            laravel: 13
          - php: 8.5
            laravel: 11

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.driver }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, ${{ matrix.driver != 'roadrunner/frankenphp' && matrix.driver || '' }}
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Show extension info
        run: |
          php --ri ${{ matrix.driver }}
        if: matrix.driver != 'roadrunner/frankenphp'

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress --with="laravel/framework:^${{ matrix.laravel }}"

      - name: Execute tests
        run: |
          vendor/bin/testbench package:sync-skeleton
          vendor/bin/phpunit --display-deprecations --fail-on-deprecation
